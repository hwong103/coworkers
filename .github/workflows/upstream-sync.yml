name: Upstream sync candidate

on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:

concurrency:
  group: coworkers-upstream-sync
  cancel-in-progress: false

permissions:
  contents: read
  issues: read

jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      status: ${{ steps.suppression.outputs.status }}
      reason: ${{ steps.suppression.outputs.reason }}
      upstream_sha: ${{ steps.prepare.outputs.upstream_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Fetch and gate upstream
        id: prepare
        env:
          COWORKERS_ACCOUNT_ID: ${{ vars.COWORKERS_ACCOUNT_ID }}
          COWORKERS_ACCESS_TEAM_DOMAIN: ${{ vars.COWORKERS_ACCESS_TEAM_DOMAIN }}
          COWORKERS_ACCESS_AUD: ${{ vars.COWORKERS_ACCESS_AUD }}
        run: node scripts/upstream-sync/prepare.mjs
      - name: Check persistent failed-candidate suppression
        id: suppression
        env:
          PREPARE_STATUS: ${{ steps.prepare.outputs.status }}
          PREPARE_REASON: ${{ steps.prepare.outputs.reason }}
          UPSTREAM_SHA: ${{ steps.prepare.outputs.upstream_sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          COWORKERS_UPDATE_ISSUE_NUMBER: ${{ vars.COWORKERS_UPDATE_ISSUE_NUMBER }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/upstream-sync/check-failure.mjs
      - name: Stop when update is blocked
        if: |
          steps.suppression.outputs.status != 'candidate-ready' &&
          steps.suppression.outputs.status != 'no-update' &&
          steps.suppression.outputs.status != 'failed-candidate-suppressed'
        run: exit 1
      - uses: pnpm/action-setup@v4
        if: steps.suppression.outputs.status == 'candidate-ready'
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        if: steps.suppression.outputs.status == 'candidate-ready'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.suppression.outputs.status == 'candidate-ready'
      - run: pnpm test
        if: steps.suppression.outputs.status == 'candidate-ready'
      - run: node --test scripts/upstream-sync/*.test.mjs
        if: steps.suppression.outputs.status == 'candidate-ready'
      - run: pnpm typecheck
        if: steps.suppression.outputs.status == 'candidate-ready'
      - run: pnpm build
        if: steps.suppression.outputs.status == 'candidate-ready'
      - name: Ensure build did not rewrite trusted source
        if: steps.suppression.outputs.status == 'candidate-ready'
        run: git diff --exit-code
      - name: Create deploy artifact
        env:
          BASE_SHA: ${{ steps.prepare.outputs.base_sha }}
          UPSTREAM_SHA: ${{ steps.prepare.outputs.upstream_sha }}
          COWORKERS_ACCOUNT_ID: ${{ vars.COWORKERS_ACCOUNT_ID }}
          COWORKERS_ACCESS_TEAM_DOMAIN: ${{ vars.COWORKERS_ACCESS_TEAM_DOMAIN }}
          COWORKERS_ACCESS_AUD: ${{ vars.COWORKERS_ACCESS_AUD }}
        run: node scripts/upstream-sync/create-artifact.mjs
        if: steps.suppression.outputs.status == 'candidate-ready'
      - name: Validate deploy artifact
        if: steps.suppression.outputs.status == 'candidate-ready'
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/.upstream-artifact
          COWORKERS_ACCOUNT_ID: ${{ vars.COWORKERS_ACCOUNT_ID }}
          COWORKERS_ACCESS_TEAM_DOMAIN: ${{ vars.COWORKERS_ACCESS_TEAM_DOMAIN }}
          COWORKERS_ACCESS_AUD: ${{ vars.COWORKERS_ACCESS_AUD }}
        run: node scripts/upstream-sync/validate-artifact.mjs
      - name: Verify uploadable deploy artifact
        if: steps.suppression.outputs.status == 'candidate-ready'
        run: |
          test -s .upstream-artifact/metadata.json
          test -s .upstream-artifact/candidate.patch
          test -s .upstream-artifact/candidate.bundle
          test -d .upstream-artifact/output
      - uses: actions/upload-artifact@v4
        if: steps.suppression.outputs.status == 'candidate-ready'
        with:
          name: coworkers-upstream-${{ github.run_id }}
          path: .upstream-artifact
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      - name: Record sync status
        if: |
          steps.suppression.outputs.status == 'no-update' ||
          steps.suppression.outputs.status == 'candidate-ready' ||
          steps.suppression.outputs.status == 'failed-candidate-suppressed'
        env:
          STATUS: ${{ steps.suppression.outputs.status }}
          REASON: ${{ steps.suppression.outputs.reason }}
          UPSTREAM: ${{ steps.prepare.outputs.upstream_sha }}
        run: |
          mkdir -p .sync-result
          jq -n \
            --arg status "$STATUS" \
            --arg reason "$REASON" \
            --arg upstream_sha "$UPSTREAM" \
            '{status:$status,reason:$reason,upstream_sha:$upstream_sha}' \
            > .sync-result/status.json
      - name: Verify uploadable sync status
        if: |
          steps.suppression.outputs.status == 'no-update' ||
          steps.suppression.outputs.status == 'candidate-ready' ||
          steps.suppression.outputs.status == 'failed-candidate-suppressed'
        run: |
          test -s .sync-result/status.json
          jq -e --arg expected "${{ steps.suppression.outputs.status }}" \
            '.status == $expected' .sync-result/status.json >/dev/null
      - uses: actions/upload-artifact@v4
        if: |
          steps.suppression.outputs.status == 'no-update' ||
          steps.suppression.outputs.status == 'candidate-ready' ||
          steps.suppression.outputs.status == 'failed-candidate-suppressed'
        with:
          name: coworkers-status-${{ github.run_id }}
          path: .sync-result
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  notify-failure:
    if: always() && needs.candidate.result != 'success'
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v7
        env:
          ISSUE: ${{ vars.COWORKERS_UPDATE_ISSUE_NUMBER }}
          STATUS: ${{ needs.candidate.outputs.status }}
          REASON: ${{ needs.candidate.outputs.reason }}
          UPSTREAM: ${{ needs.candidate.outputs.upstream_sha }}
        with:
          script: |
            const issue = Number(process.env.ISSUE)
            if (!issue) throw new Error("COWORKERS_UPDATE_ISSUE_NUMBER repository variable is required")
            const marker = process.env.UPSTREAM
              ? `<!-- coworkers-upstream-failure:${process.env.UPSTREAM} -->`
              : null
            const body = [
              "### Coworkers upstream sync failed",
              `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- Status: ${process.env.STATUS || "candidate failed"}`,
              `- Upstream: ${process.env.UPSTREAM || "unknown"}`,
              `- Reason: ${process.env.REASON || "Tests, build, or artifact validation failed"}`,
              "",
              "Production was not changed by this workflow.",
              ...(marker
                ? [
                    "",
                    "Scheduled runs for this upstream SHA are suppressed until a manual retry.",
                    marker,
                  ]
                : []),
            ].join("\n")
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              body,
            })
